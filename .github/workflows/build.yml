name: Build apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      vcode: ${{ steps.v.outputs.vcode }}
      label: ${{ steps.v.outputs.label }}
      day: ${{ steps.v.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # src/VERSION holds major.minor; people see V1.0, V1.01 … V1.10; the apps compare 2100.<major+1>.<minor>
          IFS=. read -r MA MI < src/VERSION
          MI=$((10#$MI))
          echo "ver=2100.$((MA + 1)).$MI" >> "$GITHUB_OUTPUT"
          echo "vcode=$((2100000000 + (MA + 1) * 10000 + MI))" >> "$GITHUB_OUTPUT"
          if [ "$MI" -eq 0 ]; then echo "label=V$MA.0" >> "$GITHUB_OUTPUT"; else echo "label=V$MA.$(printf %02d $MI)" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(TZ=Europe/Moscow date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    env:
      BV_VER: ${{ needs.meta.outputs.ver }}
      BV_VCODE: ${{ needs.meta.outputs.vcode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_PASS" ] && [ -f src/keys/boardv.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in src/keys/boardv.jks.enc -out "$RUNNER_TEMP/boardv.jks" -pass env:KS_PASS
            echo "BV_KEYSTORE=$RUNNER_TEMP/boardv.jks" >> "$GITHUB_ENV"
            echo "BV_KEYPASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signing with the permanent BoardV key"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASS is not set: the APK is signed with a temporary key and will not install over a previous build"
          fi
      - name: Put the web app into the APK
        run: |
          echo "window.BV_BUILD = { version: '$BV_VER', label: '${{ needs.meta.outputs.label }}', day: '${{ needs.meta.outputs.day }}', app: 'android' };" > www/build-info.js
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
      - name: Build
        run: gradle -p android assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk BoardV.apk
      - name: RuStore build (updates come from the store, so no self-update and no install permission)
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          sed -i '/new Updater(), "BoardVUpdater"/d' android/app/src/main/java/com/carnison/boardview/MainActivity.java
          sed -i "s/app: 'android'/app: 'android', store: 'rustore'/" android/app/src/main/assets/www/build-info.js
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk BoardV-rustore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BoardV-android
          path: |
            BoardV.apk
            BoardV-rustore.apk

  windows:
    name: Windows EXE (WebView2)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web app inside the exe
        shell: bash
        run: |
          echo "window.BV_BUILD = { version: '${{ needs.meta.outputs.ver }}', label: '${{ needs.meta.outputs.label }}', day: '${{ needs.meta.outputs.day }}', app: 'windows' };" > www/build-info.js
          printf 'version=%s\napp=BoardV\nsetup=BoardV-Setup.exe\nportable=BoardV-Setup.exe\n' "${{ needs.meta.outputs.ver }}" > src/win/build.txt
          cd www && 7z a -tzip -mx=9 ../src/win/www.zip . > /dev/null
      - name: Build the exe
        shell: bash
        run: |
          IFS=. read -r MA MI < src/VERSION; MI=$(echo "$MI" | tr -dc 0-9)
          if ! dotnet build src/win/BoardV.csproj -c Release -nologo -p:BvFileVersion=$MA.$((10#$MI)).0 > build.log 2>&1; then
            grep -iE "error|warn" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -5 build.log; exit 1
          fi
      - name: Installer, update feed
        shell: bash
        run: |
          EXE=$(find src/win/bin -name BoardV.exe | head -1)
          mkdir -p dist && cp "$EXE" src/win/BoardV.exe
          MN=$(command -v makensis || true); [ -z "$MN" ] && MN="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$MN" ] || command -v makensis > /dev/null || choco install nsis -y --no-progress > /dev/null
          cd src/win
          if ! "$MN" -V2 -DVERSION=${{ needs.meta.outputs.ver }} -DOUTFILE=BoardV-Setup.exe -DEXE=BoardV.exe installer.nsi > nsis.log 2>&1; then
            tail -25 nsis.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          mv BoardV-Setup.exe ../../dist/ && cd ../..
          # latest.yml: the feed the earlier Electron build checks, so it updates itself to this one
          SHA=$(openssl dgst -sha512 -binary dist/BoardV-Setup.exe | openssl base64 -A); SIZE=$(stat -c %s dist/BoardV-Setup.exe)
          printf 'version: %s\nfiles:\n  - url: BoardV-Setup.exe\n    sha512: %s\n    size: %s\npath: BoardV-Setup.exe\nsha512: %s\nreleaseDate: %s\n' "${{ needs.meta.outputs.ver }}" "$SHA" "$SIZE" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > dist/latest.yml
          echo "::notice::$(ls -la dist | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: BoardV-windows
          path: dist/*

  release:
    name: Release (download links, updates)
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
          LABEL: ${{ needs.meta.outputs.label }}
          DAY: ${{ needs.meta.outputs.day }}
        run: |
          set -e
          ls -R dl
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          printf '%s\n' "BoardV $LABEL от $DAY." "" "Всегда последняя версия:" "- Android: $BASE/BoardV.apk" "- Windows, установщик: $BASE/BoardV-Setup.exe" "" "Приложения сами проверяют обновления: Настройки → Обновления." > notes.md
          gh release delete "v$VER" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true  # same version rebuilt: replace it
          gh release create "v$VER" dl/BoardV-android/BoardV.apk dl/BoardV-android/BoardV-rustore.apk dl/BoardV-windows/* --repo "$GITHUB_REPOSITORY" --title "BoardV $LABEL — $DAY" --notes-file notes.md --latest
      - name: Keep only the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[].tag_name'); do
            [ "$t" = "v$VER" ] || gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
          for t in $(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" -q '.[].name'); do
            [ "$t" = "v$VER" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
