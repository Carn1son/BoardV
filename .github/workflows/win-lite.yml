name: Windows Lite (test build)

on:
  push:
    branches: [ win-lite ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  winlite:
    name: Windows Lite (WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          IFS=. read -r MA MI < src/VERSION
          MI=$((10#$MI))
          echo "ver=2100.$((MA + 1)).$MI" >> "$GITHUB_OUTPUT"
          echo "fver=$((MA)).$MI.0" >> "$GITHUB_OUTPUT"
          if [ "$MI" -eq 0 ]; then echo "label=V$MA.0" >> "$GITHUB_OUTPUT"; else echo "label=V$MA.$(printf %02d $MI)" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(TZ=Europe/Moscow date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"
      - name: Web app inside the exe
        shell: bash
        run: |
          echo "window.BV_BUILD = { version: '${{ steps.v.outputs.ver }}', label: '${{ steps.v.outputs.label }}', day: '${{ steps.v.outputs.day }}', app: 'windows' };" > www/build-info.js
          printf 'version=%s\napp=BoardV Lite\nsetup=BoardV-Lite-Setup.exe\nportable=BoardV-Lite.exe\n' "${{ steps.v.outputs.ver }}" > src/win/build.txt
          cd www && 7z a -tzip -mx=9 ../src/win/www.zip . -xr!dbg.html -xr!demo.html > /dev/null && cd .. && ls -la src/win/www.zip
      - name: Build the exe
        shell: bash
        run: dotnet build src/win/BoardV.csproj -c Release -nologo -p:BvFileVersion=${{ steps.v.outputs.fver }}
      - name: Installer
        shell: bash
        run: |
          set -o pipefail
          EXE=$(find src/win/bin -name BoardV.exe | head -1)
          echo "::notice::exe at $EXE ($(stat -c %s "$EXE") bytes)"
          cp "$EXE" BoardV-Lite.exe
          MN=$(command -v makensis || true); [ -z "$MN" ] && [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ] && MN="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ -z "$MN" ]; then choco install nsis -y --no-progress > /dev/null; MN="/c/Program Files (x86)/NSIS/makensis.exe"; fi
          echo "::notice::makensis: $MN"
          cp BoardV-Lite.exe src/win/BoardV-Lite.exe
          cd src/win
          if ! "$MN" -V2 -DVERSION=${{ steps.v.outputs.ver }} "-DAPPNAME=BoardV Lite" -DOUTFILE=BoardV-Lite-Setup.exe -DEXE=BoardV-Lite.exe installer.nsi > nsis.log 2>&1; then
            tail -25 nsis.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          mv BoardV-Lite-Setup.exe ../../ && cd ../.. && ls -la BoardV-Lite*.exe
          echo "::notice::sizes $(stat -c '%n %s' BoardV-Lite*.exe | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: BoardV-Lite
          path: BoardV-Lite*.exe
      - name: Test release (pre-release, the normal "latest" stays as it is)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lite-test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          printf '%s\n' "Тестовая сборка BoardV для Windows на WebView2 (${{ steps.v.outputs.label }})." "" "- BoardV-Lite-Setup.exe — установка (ставится отдельно, рядом с обычным BoardV)" "- BoardV-Lite.exe — без установки" > notes.md
          gh release create lite-test BoardV-Lite-Setup.exe BoardV-Lite.exe --repo "$GITHUB_REPOSITORY" --prerelease --title "BoardV Lite — тест ${{ steps.v.outputs.label }}" --notes-file notes.md --target "$GITHUB_SHA"
