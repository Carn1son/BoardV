<style>
/* Layout: repair-bench viewer — slim top bar, inspector on the left, board canvas fills the rest, status line at the bottom.
   Deliberately single dark theme, like bench boardview tools: the board reads best on black in any room light. */
:root {
  color-scheme: dark;
  --bg: #0b0d0d; --panel: #131716; --panel2: #191e1c; --fg: #e4ebe7; --muted: #8b9a93; --line: #27302c;
  --accent: #f2b544; --accent-fg: #1a1203;
  --board: #3a3e3d; --edge: #8d9491; --silk: #cfd8d3; --pin: #f4f6f5; --gnd: #9aa19e; --nc: #141615;
  --botpart: #7fa9e8; --sel: #ffd60a; --selpart: #ffffff; --grp: #ffffff; --grpb: #ffffff; --hlw: #ffffff; --hlk: #000000; --pwr: #6d0f14; --dim: #5a605e; --refc: #ffffff; --canvas: #1b1d1c; --outline: #d4d8d6; --valc: #e6ebe8; --board2: #173a2c; --partfill: #cfd8d3; --selhere: #ffffff; --selfar: #ffffff;
  --ui-grp: var(--grp); --ui-sel: var(--sel); --ui-pin: var(--pin); --ui-refc: var(--refc); --ui-bot: var(--botpart);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
html[data-ui=light] { color-scheme: light; --bg: #e9edeb; --panel: #ffffff; --panel2: #f2f4f3; --fg: #18201c; --muted: #5b6862; --line: #d2d9d5; --accent: #e07b00; --accent-fg: #ffffff;
  --ui-grp: #18201c; --ui-sel: #9a6f00; --ui-pin: #18201c; --ui-refc: #18201c; --ui-bot: #2f63b8; }
html[data-ui=light] .netlink.pwr { color: #a3121b; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 13px; line-height: 1.4; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-display); font-size: 16px; letter-spacing: .06em; white-space: nowrap; color: var(--fg); }

.iconbtn { width: 34px; height: 32px; padding: 0; border: 0; background: none; color: var(--fg); cursor: pointer; display: inline-grid; place-items: center; border-radius: 6px; flex: none; }
.iconbtn svg { width: 22px; height: 22px; display: block; }
.iconbtn:hover { color: color-mix(in srgb, var(--accent) 70%, var(--fg)); }
.iconbtn[aria-pressed=true] { color: var(--accent); }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#uiBtn { margin-left: auto; }
.btn.ico { width: 40px; height: 32px; padding: 0; display: inline-grid; place-items: center; }
.btn.ico svg, .mbtn svg { width: 17px; height: 17px; display: block; }
.fileName { color: var(--muted); font-family: var(--f-mono); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 120px; }
.btn { font: inherit; font-weight: 500; padding: 6px 11px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:hover { filter: brightness(1.12); }
.btn:focus-visible, .seg button:focus-visible, .row:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sidesel { font: inherit; font-weight: 500; height: 32px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel2); color: var(--fg); cursor: pointer; }
.sidesel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[aria-pressed=true]#bomToggle { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { font: inherit; padding: 5px 10px; border: 0; background: var(--panel2); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); }
.main { --lw: 330px; --rw: 440px; display: grid; grid-template-columns: var(--lw) 6px minmax(0, 1fr) 6px var(--rw); min-height: 0; }
.main.nobom { grid-template-columns: var(--lw) 6px minmax(0, 1fr) 0 0; }
.main.nobom .rpanel, .main.nobom #splitR { display: none; }
.setbody { overflow: auto; padding: 10px 12px 12px; display: grid; gap: 8px; align-content: start; }
.setbody fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 10px; margin: 0; display: grid; gap: 7px; }
.setbody legend { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 0 4px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; }
.srow span { min-width: 0; }
.srow output { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.srow input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.srow input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.srow.chk { grid-template-columns: auto minmax(0, 1fr); cursor: pointer; }
.srow.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.presetrow { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 2px 2px 4px; }
.presetrow span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.presetrow select { font: inherit; font-weight: 600; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; cursor: pointer; }
.presetrow select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
details.grp { border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel2) 55%, transparent); }
details.grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-weight: 600; border-radius: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
details.grp > summary:hover { background: var(--panel2); }
details.grp > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
details.grp > summary small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11.5px; }
details.grp .gbody { display: grid; gap: 8px; padding: 4px 12px 12px; }

    else if (m.type === 'error') updSet('error', { msg: m.data });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-upd]'); if (!b) return;
    var a = b.dataset.upd;
    if (a === 'check') checkUpdates(false);
    else if (a === 'go') startUpdate();
    else if (a === 'perm') window.BoardVUpdater.openInstallSettings();
    else if (a === 'install') window.bvDesktop.update.install();
    else if (a === 'later') $('updBar').hidden = true;
  });
  $('setBody').addEventListener('change', function (e) {
    if (e.target.id !== 'updAuto') return;
    UPD.auto = e.target.checked; try { localStorage.setItem('bvr-autoupd', UPD.auto ? '1' : '0'); } catch (x) {}
  });
  if (CAN_UPDATE && UPD.auto) setTimeout(function () { checkUpdates(true); }, 4000);
  if (BUILD && BUILD.label) $('verLine').textContent = 'Версия ' + BUILD.label + ' · ' + BUILD.day;

  /* ---------- files opened from the system (double-click, "Open with") ---------- */
  if ('launchQueue' in window && window.launchQueue.setConsumer) {
    window.launchQueue.setConsumer(function (lp) {
      if (!lp || !lp.files || !lp.files.length) return;
      Promise.all(lp.files.map(function (h) { return h.getFile(); })).then(function (fs) { loadFiles(fs); });
    });
  }
  if (window.bvDesktop) {
    window.bvDesktop.onOpenFiles(function (list) { loadFiles(list.map(function (f) { return new File([f.data], f.name); })); });
    window.bvDesktop.ready();
  }

  /* ---------- no browser context menu (except in text fields) ---------- */
  document.addEventListener('contextmenu', function (e) {
    var t = e.target, tag = (t && t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
    e.preventDefault();
  });

  /* ---------- phone sheet ---------- */
  function openSheet(t) {
    if (!IS_PHONE) return;
    var de = document.documentElement;
    if (!t) { de.classList.remove('sheet-open'); $('mmenu').setAttribute('aria-expanded', 'false'); return; }
    de.dataset.mtab = t; de.classList.add('sheet-open'); $('mmenu').setAttribute('aria-expanded', 'true');
    document.querySelectorAll('#msheet .mtab').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.mt === t)); });
    if (t === 'bom' || t === 'set') { var was = SETOPEN; SETOPEN = t === 'set'; if (SETOPEN) { if (!was) GROUPS_OPEN = {}; buildSettings(); } applyLayout(false); }
  }
  function pickedOnPhone() { if (IS_PHONE) openSheet(null); }
  $('mmenu').onclick = function () { openSheet(document.documentElement.classList.contains('sheet-open') ? null : (document.documentElement.dataset.mtab || 'info')); };
  $('mclose').onclick = function () { openSheet(null); };
  document.querySelectorAll('#msheet .mtab').forEach(function (b) { b.onclick = function () { openSheet(b.dataset.mt); }; });
  $('mfit').onclick = function () { fit(); req(); };

  /* ---------- status ---------- */
  var cursor = null;
  function status(msg) {
    var h = '';
    if (msg) h = '<span><b>' + esc(msg) + '</b></span>';
    else if (M) {
      h += '<span>Сторона <b>' + ({ top: 'верх', bottom: 'низ (зеркально)', both: 'обе' })[V.side] + '</b></span><span>Поворот <b>' + V.rot * 90 + '°</b></span>';
      if (S.part) h += '<span>Деталь <b>' + esc(S.part.ref) + '</b>' + (S.part.value ? ' · ' + esc(S.part.value) : '') + '</span>';
      if (S.net) h += '<span>Цепь <b style="color:var(--ui-sel)">' + esc(S.net) + '</b></span>';
      if (S.group && groupByKey(S.group)) { var g = groupByKey(S.group); h += '<span>Позиция <b style="color:var(--ui-grp)">' + esc(g.value || '—') + (g.footprint ? ' · ' + esc(g.footprint) : '') + ' × ' + g.parts.length + '</b></span>'; }
    }
    else if (!M) h = '<span>Файл не открыт</span>';
    if (IS_PHONE) h += '<span class="mlogo"><i class="logo" aria-hidden="true"></i>BoardV</span>'; // the header brand is hidden on phones to make room for buttons
    $('status').innerHTML = h;
  }

  /* ---------- interaction ---------- */
  function resize() {
    var r = $('stage').getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    var first = !W, w0 = W, h0 = H; W = Math.max(1, r.width); H = Math.max(1, r.height);
    if (!first && (W !== w0 || H !== h0)) { if (M && FX.autoFit) fit(); else { V.cx += (W - w0) / 2; V.cy += (H - h0) / 2; } }
    var pw = Math.round(W * dpr), ph = Math.round(H * dpr);
    if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; draw(); }
    if (first) fit(); req();
  }
  new ResizeObserver(resize).observe($('stage'));
  var ptrs = {}, drag = null, pinch = null;
  cv.addEventListener('pointerdown', function (e) {
    if (!M) return; cv.setPointerCapture(e.pointerId); ptrs[e.pointerId] = [e.clientX, e.clientY];
    var ids = Object.keys(ptrs);
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: V.k }; drag = null; }
    else drag = { x: e.clientX, y: e.clientY, cx: V.cx, cy: V.cy, moved: false };
  });
  cv.addEventListener('pointermove', function (e) {
    if (!M) return;
    var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (ptrs[e.pointerId]) ptrs[e.pointerId] = [e.clientX, e.clientY];
    if (pinch) {
      var ids = Object.keys(ptrs); if (ids.length < 2) return;
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, (pinch.k * d / pinch.d) / V.k); return;
    }
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; cv.classList.add('drag'); $('tip').hidden = true; }
      if (drag.moved) { V.cx = drag.cx + dx; V.cy = drag.cy + dy; req(); return; }
    }
    if (e.pointerType === 'mouse') {
      var h = hit(mx, my), changed = !hover !== !h || (h && hover && (h.pin !== hover.pin || h.part !== hover.part));
      hover = h;
      var tip = $('tip');
      if (h) {
        tip.hidden = false; tip.style.left = mx + 'px'; tip.style.top = my + 'px';
        tip.innerHTML = h.pin ? esc(h.part.ref) + '.' + esc(h.pin.name) + ' · <em>' + esc(h.pin.net === 'UNCONNECTED' ? 'N/C' : h.pin.net) + '</em>'
                              : esc(h.part.ref) + (h.part.value ? ' · <em>' + esc(h.part.value) + '</em>' : '') + (h.part.footprint ? ' · ' + esc(h.part.footprint) : '');
      } else tip.hidden = true;
      if (changed) req();
    }
  });
  function endPtr(e) {
    delete ptrs[e.pointerId];
    if (pinch) { if (Object.keys(ptrs).length < 2) pinch = null; return; }
    cv.classList.remove('drag');
    if (drag && !drag.moved && M) {
      var r = cv.getBoundingClientRect(), h = hit(e.clientX - r.left, e.clientY - r.top);
      if (h) S.group = null;
      if (h && h.pin) { S.part = h.part; if (h.pin.net !== 'UNCONNECTED') S.net = h.pin.net; else S.net = null; renderCard(); renderList(); req(); }
      else if (h) { S.net = null; selectPart(h.part, false); }
      else clearSel();
      status();
    }
    drag = null;
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('pointerleave', function () { $('tip').hidden = true; if (hover) { hover = null; req(); } });
  cv.addEventListener('wheel', function (e) { if (!M) return; e.preventDefault(); var r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016 * (FX.zoomSpeed || 1) * (FX.wheelInvert ? -1 : 1))); }, { passive: false });
  function zoomAt(mx, my, f) { var k2 = Math.max(0.0005, Math.min(400, V.k * f)); f = k2 / V.k; V.cx = mx - (mx - V.cx) * f; V.cy = my - (my - V.cy) * f; V.k = k2; req(); }
  function setSide(s, keepView) {
    if (M && !keepView && W) {
      // keep the point under the screen center in place when flipping
      var c = s2w(W / 2, H / 2); V.side = s; var p = w2s(c[0], c[1]); V.cx += W / 2 - p[0]; V.cy += H / 2 - p[1];
    } else V.side = s;
    $('sideSel').value = s;
    status(); req();
  }
  $('sideSel').onchange = function () { setSide(this.value); this.blur(); };
  function cycleSide() { setSide({ top: 'bottom', bottom: 'both', both: 'top' }[V.side]); }
  function rotate() { if (!M) return; var c = s2w(W / 2, H / 2); V.rot = (V.rot + 1) % 4; var p = w2s(c[0], c[1]); V.cx += W / 2 - p[0]; V.cy += H / 2 - p[1]; status(); req(); }
  $('rot').onclick = rotate;
  $('fit').onclick = function () { fit(); req(); };
  function runAction(a) {
    if (a === 'search') { if (IS_PHONE) openSheet('info'); $('q').focus(); $('q').select(); }
    else if (a === 'flip') setSide(V.side === 'top' ? 'bottom' : 'top');
    else if (a === 'top' || a === 'bottom' || a === 'both') setSide(a);
    else if (a === 'cycle') cycleSide();
    else if (a === 'rotate') rotate();
    else if (a === 'fit') { fit(); req(); }
    else if (a === 'clear') { if (SETOPEN && !IS_PHONE) setSettings(false); else clearSel(); }
    else if (a === 'zoomIn') zoomAt(W / 2, H / 2, 1.4);
    else if (a === 'zoomOut') zoomAt(W / 2, H / 2, 1 / 1.4);
    else if (a === 'bom') $('bomToggle').click();
    else if (a === 'settings') setSettings(!SETOPEN);
    else if (a === 'ui') setUi(UI === 'dark' ? 'light' : 'dark');
    else if (a === 'values' || a === 'pinNums') { var k = a === 'values' ? 'showValues' : 'showPinNums'; CFG.fx[k] = !CFG.fx[k]; applyCfg(true); if (SETOPEN) buildSettings(); flash((a === 'values' ? 'Номиналы ' : 'Номера пинов ') + (CFG.fx[k] ? 'показаны' : 'скрыты')); }
    else if (a === 'open') $('file').click();
  }
  function actionFor(combo) { for (var i = 0; i < ACTIONS.length; i++) if ((CFG.keys[ACTIONS[i][0]] || []).indexOf(combo) >= 0) return ACTIONS[i][0]; return null; }
  document.addEventListener('keydown', function (e) {
    if (KEYCAP) { // assigning a key in the settings
      if (/^(Shift|Control|Alt|Meta|OS)(Left|Right)?$/.test(e.code) || e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
      e.preventDefault(); e.stopPropagation();
      var a = KEYCAP; KEYCAP = null;
      if (e.code === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey) { buildSettings(); return; }
      var combo = comboOf(e), from = actionFor(combo);
      if (from && from !== a) CFG.keys[from] = CFG.keys[from].filter(function (c) { return c !== combo; });
      if ((CFG.keys[a] || []).indexOf(combo) < 0) (CFG.keys[a] = CFG.keys[a] || []).push(combo);
      changed('свои клавиши (не сохранено в файл)', true); buildSettings(); renderCard();
      var nm = function (x) { return ACTIONS.filter(function (y) { return y[0] === x; })[0][1]; };
      flash(keyLabel(combo) + ' → «' + nm(a) + '»' + (from && from !== a ? ', снято с «' + nm(from) + '»' : ''));
      return;
    }
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var c = comboOf(e), act = actionFor(c);
    if (!act && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) act = actionFor(c.replace('Shift+', '')); // e.g. Shift+= for "+"
    if (!act) return;
    if (act !== 'clear' && e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return; // let buttons react to their own keys
    e.preventDefault(); runAction(act);
  });

  /* ---------- files in ---------- */
  $('open').onclick = function () { $('file').click(); };
  $('empty').onclick = function () { $('file').click(); };
  $('empty').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
  $('file').onchange = function () { if (this.files.length) loadFiles(this.files); this.value = ''; };
  var depth = 0;
  function hasFiles(e) { var t = e.dataTransfer && e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0; }
  window.addEventListener('dragenter', function (e) { if (!hasFiles(e)) return; e.preventDefault(); depth++; $('mask').hidden = false; });
  window.addEventListener('dragleave', function (e) { if (!hasFiles(e)) return; e.preventDefault(); if (--depth <= 0) { depth = 0; $('mask').hidden = true; } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); depth = 0; $('mask').hidden = true; if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

  function refreshAll(refit) {
    buildNetIndex();
    $('empty').hidden = !!M; applyLayout(false);
    $('fileName').textContent = src.files.join(' + ');
    if (refit) { V.rot = IS_PHONE && H > W * 1.15 && M.w > M.h * 1.15 ? 1 : 0; setSide('top', true); fit(); } // phone held upright + wide board: turn it to fill the screen
    renderCard(); renderList(); status(); req();
  }

  /* ---------- start ---------- */
  applyCfg(false);
  status(); req(); // empty field until a file is dropped or picked
  I18N.set(LANG);
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
